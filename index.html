<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animalia · Enciclopedia de animales</title>
  <meta name="description" content="Enciclopedia interactiva de animales: mamíferos, aves, reptiles, anfibios, peces e invertebrados, con datos, curiosidades y comparador.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🐾</span>
      <div>
        <h1>Animalia</h1>
        <p>Enciclopedia de animales</p>
      </div>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Buscar animal, hábitat, dieta…" autocomplete="off" aria-label="Buscar animal">
      <select id="sort" aria-label="Ordenar">
        <option value="name">Nombre (A-Z)</option>
        <option value="kg">Más pesados</option>
        <option value="cm">Más grandes</option>
        <option value="kmh">Más rápidos</option>
        <option value="yrs">Más longevos</option>
      </select>
      <button id="random" type="button" title="Animal aleatorio">🎲 Al azar</button>
      <button id="voice" type="button" aria-pressed="true" title="Activar o desactivar la voz">🗣️ Voz: sí</button>
    </div>
  </header>

  <nav id="classes" class="class-filter" aria-label="Filtrar por grupo"></nav>

  <main>
    <p id="count" class="count" aria-live="polite"></p>
    <section id="grid" class="grid" aria-label="Lista de animales"></section>
    <p id="empty" class="empty" hidden>No se encontró ningún animal.</p>
  </main>

  <dialog id="modal" aria-label="Ficha del animal">
    <div id="sheet"></div>
  </dialog>

  <footer>
    Textos de <a href="https://es.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> (licencia CC BY-SA 4.0).
    Fotos de <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>, con autor y licencia indicados en cada ficha.
    Estado de conservación según la Lista Roja de la UICN; los demás datos son aproximados.
  </footer>

  <script src="animals.js"></script>
  <script src="wiki-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
